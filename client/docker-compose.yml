services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:${SERVER_PORT:-5000}
    container_name: frontend
    restart: always
    environment:
      - PORT=${CLIENT_PORT:-3000}
    ports:
      - "${CLIENT_PORT:-3000}:3000" 
    networks:
      - shared-net
networks:
  shared-net:
    external: true
