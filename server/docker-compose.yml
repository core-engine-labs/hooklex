services:
  app:
    build: .
    container_name: backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:abc2712d%24@host.docker.internal:5432/open-hooklex?schema=public
      - CLIENT_URL=http://localhost:${CLIENT_PORT:-3000}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    command:
      - "dist/start-all.js"  # <-- Mandatory script entry point
      - "--read-limit"
      - "${READ_LIMIT:-100}"
      - "--write-limit"
      - "${WRITE_LIMIT:-100}"
      - "--expire-after"
      - "${EXPIRE_AFTER:-1}"
      - "--cron-schedule"
      - "${CRON_SCHEDULE:-*/5 * * * *}"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
